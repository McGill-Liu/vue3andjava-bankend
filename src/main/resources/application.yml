server:
  port: ${SERVER_PORT:8080}

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:points_mall}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your@qq.com}
    password: ${MAIL_PASSWORD:replace-me}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  upload:
    directory: ${UPLOAD_DIRECTORY:uploads}
  jwt:
    secret: ${JWT_SECRET:pointsmall-secret-key-pointsmall-secret-key-2026}
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:7200}
    customer-access-token-seconds: ${JWT_CUSTOMER_ACCESS_TOKEN_SECONDS:604800}
    refresh-token-seconds: ${JWT_REFRESH_TOKEN_SECONDS:2592000}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
