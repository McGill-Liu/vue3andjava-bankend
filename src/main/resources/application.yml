server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/points_mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false
  mail:
    host: smtp.qq.com
    port: 587
    username: your@qq.com
    password: replace-me
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: pointsmall-secret-key-pointsmall-secret-key
    access-token-seconds: 7200
    refresh-token-seconds: 2592000

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
