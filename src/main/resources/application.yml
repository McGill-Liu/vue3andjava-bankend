server:
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  bootstrap:
    super-admin:
      enabled: ${BOOTSTRAP_SUPER_ADMIN_ENABLED:false}
      name: ${BOOTSTRAP_SUPER_ADMIN_NAME:}
      email: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_SUPER_ADMIN_PASSWORD:}
  wechat:
    open-id-login-enabled: ${WECHAT_OPEN_ID_LOGIN_ENABLED:false}
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
  upload:
    directory: ${UPLOAD_DIRECTORY}
  jwt:
    secret: ${JWT_SECRET}
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:7200}
    customer-access-token-seconds: ${JWT_CUSTOMER_ACCESS_TOKEN_SECONDS:604800}
    refresh-token-seconds: ${JWT_REFRESH_TOKEN_SECONDS:2592000}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
